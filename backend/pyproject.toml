[project]
name = "tactical-lab-backend"
version = "0.1.0"
description = "Spatiotemporal tactical pattern mining — research prototype API"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
